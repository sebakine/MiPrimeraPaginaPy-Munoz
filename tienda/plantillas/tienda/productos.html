{% extends 'tienda/base.html' %}

{% block contenido %}
    <h1>Lista de Productos</h1>
    
    <ul>
    {% for producto in productos %}
        <li>{{ producto.nombre }} - Precio: ${{ producto.precio }}</li>
    {% empty %}
        <li>Todavía no hay productos agregados.</li>
    {% endfor %}
    </ul>
{% endblock %}
